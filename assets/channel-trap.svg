<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">A missing connection is not a human</title>
<desc id="desc">Two by two information topology matrix. Top row: private link on, human participant with permitted machine gateway versus a connected machine. Bottom row: private link off, isolated human versus disconnected machine. The same link state can occur with different participant origins.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#181b2d"/><stop offset="1" stop-color="#25263d"/></linearGradient>
 <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b2f7df"/><stop offset="1" stop-color="#d1f5ff"/></linearGradient>
 <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9c9d1"/><stop offset="1" stop-color="#e4d1ff"/></linearGradient>
 <pattern id="grain" patternUnits="userSpaceOnUse" width="19" height="19"><circle cx="2" cy="2" r="1" fill="#c9c5e9" opacity=".15"/></pattern>
</defs>
<rect width="1200" height="560" rx="28" fill="url(#bg)"/>
<rect width="1200" height="560" rx="28" fill="url(#grain)"/>
<g font-family="Arial, Helvetica, sans-serif">
 <text x="60" y="58" font-size="17" font-weight="700" fill="#b8fce2" letter-spacing="3">THE CHANNEL TRAP / 02</text>
 <text x="60" y="111" font-size="42" font-weight="800" fill="#ffffff">You found the wire.</text>
 <text x="60" y="153" font-size="42" font-weight="800" fill="#d4c6ff">Did you find the human?</text>
 <text x="423" y="194" font-size="15" text-anchor="middle" fill="#dcd5fc" letter-spacing="2.5">HUMAN ENDPOINT</text>
 <text x="860" y="194" font-size="15" text-anchor="middle" fill="#dcd5fc" letter-spacing="2.5">MACHINE ENDPOINT</text>
 <text x="70" y="296" font-size="17" font-weight="700" text-anchor="middle" fill="#f0e8ff" transform="rotate(-90 70 296)">LINK ON</text>
 <text x="70" y="453" font-size="17" font-weight="700" text-anchor="middle" fill="#f0e8ff" transform="rotate(-90 70 453)">LINK OFF</text>
 <rect x="177" y="210" width="465" height="137" rx="22" fill="url(#rose)" opacity=".94"/>
 <rect x="664" y="210" width="466" height="137" rx="22" fill="url(#mint)" opacity=".95"/>
 <rect x="177" y="369" width="465" height="137" rx="22" fill="#302c45" stroke="#f8bdcd" stroke-opacity=".9" stroke-width="2"/>
 <rect x="664" y="369" width="466" height="137" rx="22" fill="#293849" stroke="#9af4d5" stroke-opacity=".9" stroke-width="2"/>
 <circle cx="234" cy="269" r="25" fill="#2b2943"/>
 <text x="234" y="279" font-size="28" text-anchor="middle" fill="#ffcdd8">H</text>
 <text x="283" y="258" font-size="26" font-weight="800" fill="#252137">Human + gateway</text>
 <text x="283" y="284" font-size="16" fill="#514861">Composite, tool-assisted participant</text>
 <text x="283" y="315" font-size="13" letter-spacing="1.4" fill="#6a5074">ONLY IF THE RULES ALLOW IT</text>
 <circle cx="721" cy="269" r="25" fill="#234438"/>
 <text x="721" y="279" font-size="28" text-anchor="middle" fill="#bdfae4">M</text>
 <text x="770" y="258" font-size="26" font-weight="800" fill="#203b38">Connected machine</text>
 <text x="770" y="284" font-size="16" fill="#4d6661">Private information edge available</text>
 <text x="770" y="315" font-size="13" letter-spacing="1.4" fill="#477e71">TRANSFER ≠ IDENTITY</text>
 <circle cx="234" cy="426" r="25" fill="#4c3c50"/>
 <text x="234" y="436" font-size="28" text-anchor="middle" fill="#ffd0db">H</text>
 <text x="283" y="417" font-size="26" font-weight="800" fill="#ffebf5">Isolated human</text>
 <text x="283" y="444" font-size="16" fill="#deccd9">No private channel available</text>
 <text x="283" y="474" font-size="13" letter-spacing="1.4" fill="#f4c0d0">LINK ABSENT</text>
 <circle cx="721" cy="426" r="25" fill="#24463c"/>
 <text x="721" y="436" font-size="28" text-anchor="middle" fill="#b3fadd">M</text>
 <text x="770" y="417" font-size="26" font-weight="800" fill="#e2fffa">Disconnected machine</text>
 <text x="770" y="444" font-size="16" fill="#bcded4">No private channel available</text>
 <text x="770" y="474" font-size="13" letter-spacing="1.4" fill="#abf4d6">SAME SIGNAL, DIFFERENT ORIGIN</text>
 <text x="60" y="535" fill="#d4d0ec" font-size="16">Connectivity is not a classifier of biological origin. Test both factors.</text>
</g>
</svg>
